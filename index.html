<!DOCTYPE html>
<html>
<head>
    <!-- Load the Office JavaScript API -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 15px; }
        input, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border-radius: 4px; }
        button { background-color: #107c41; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0c5e31; }
        #message { color: dimgray; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
    <h3>Sheet Navigator</h3>
    <input type="text" id="searchInput" placeholder="Enter sheet name (partial or exact)...">
    <button onclick="searchSheet()">Search & Go</button>
    <button onclick="searchFromSelection()" style="background-color: #0078d4;">Search from Selected Cells</button>
    <div id="message"></div>

    <script>
        Office.onReady(function (info) {
            // The task pane is ready
        });

        async function searchSheet(query = null) {
            await Excel.run(async (context) => {
                const searchTxt = query || document.getElementById('searchInput').value.toLowerCase();
                const sheets = context.workbook.worksheets;
                
                // CRITICAL FOR SPEED: Only load sheet names, ignore all sheet data
                sheets.load("items/name"); 
                await context.sync();
                
                let found = false;
                for (let i = 0; i < sheets.items.length; i++) {
                    let sheetName = sheets.items[i].name.toLowerCase();
                    // Fuzzy match: if the sheet name contains your text, activate it
                    if (sheetName.includes(searchTxt)) {
                        sheets.items[i].activate();
                        document.getElementById('message').innerText = "Found: " + sheets.items[i].name;
                        found = true;
                        break;
                    }
                }
                
                if (!found) {
                    document.getElementById('message').innerText = "No matching sheet found.";
                }
                await context.sync();
            }).catch(console.error);
        }

        async function searchFromSelection() {
            await Excel.run(async (context) => {
                const range = context.workbook.getSelectedRange();
                range.load("text");
                await context.sync();

                let query = "";
                // Concatenate text from all selected cells
                for (let r = 0; r < range.text.length; r++) {
                    for (let c = 0; c < range.text[r].length; c++) {
                        query += range.text[r][c];
                    }
                }
                
                query = query.trim();
                if (query) {
                    document.getElementById('searchInput').value = query;
                    await searchSheet(query.toLowerCase());
                } else {
                    document.getElementById('message').innerText = "Selected cells are empty.";
                }
            });
        }
    </script>
</body>
</html>
